name: Nightly Trial Build

on:
  workflow_dispatch:

jobs:
  nightly-trial:
    name: Build Nightly APK (Trial)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Remove local Java path from gradle.properties
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          STATS_BASE_URL: ${{ secrets.STATS_BASE_URL }}
          AUTH_API_BASE_URL: ${{ secrets.AUTH_API_BASE_URL }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "${GOOGLE_SERVICES_JSON}" | base64 --decode > app/google-services.json
          echo "${SIGNING_KEY_BASE64}" | base64 --decode > app/keystore.jks
          
          echo "google.api.key=${GOOGLE_API_KEY}" >> local.properties
          echo "stats.api.key=${STATS_API_KEY}" >> local.properties
          echo "stats.base.url=${STATS_BASE_URL}" >> local.properties
          echo "auth.api.base.url=${AUTH_API_BASE_URL}" >> local.properties

      - name: Build Nightly APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew assembleNightly \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/app/keystore.jks" \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      - name: Rename APK
        run: mv app/build/outputs/apk/nightly/app-nightly.apk AirBeats-Nightly-Trial.apk

      - name: Upload Trial Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Nightly-Trial-APK
          path: AirBeats-Nightly-Trial.apk
