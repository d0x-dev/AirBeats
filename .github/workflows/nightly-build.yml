name: Nightly Build

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  nightly-release:
    name: Build & Release Nightly APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Remove local Java path from gradle.properties
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bump Version
        run: |
          VERSION_CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          
          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION_NAME"
          PATCH_VERSION=${VERSION_PARTS[2]}
          NEW_PATCH_VERSION=$((PATCH_VERSION + 1))
          NEW_VERSION_NAME="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.$NEW_PATCH_VERSION"
          
          sed -i "s/versionCode = $VERSION_CODE/versionCode = $NEW_VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"$VERSION_NAME\"/versionName = \"$NEW_VERSION_NAME\"/" app/build.gradle.kts
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: Bump version to $NEW_VERSION_NAME (Nightly)"
          git push
          
          echo "NEW_VERSION_NAME=$NEW_VERSION_NAME" >> $GITHUB_ENV

      - name: Inject Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          STATS_BASE_URL: ${{ secrets.STATS_BASE_URL }}
          AUTH_API_BASE_URL: ${{ secrets.AUTH_API_BASE_URL }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "${GOOGLE_SERVICES_JSON}" | base64 --decode > app/google-services.json
          echo "${SIGNING_KEY_BASE64}" | base64 --decode > app/keystore.jks
          
          echo "google.api.key=${GOOGLE_API_KEY}" >> local.properties
          echo "stats.api.key=${STATS_API_KEY}" >> local.properties
          echo "stats.base.url=${STATS_BASE_URL}" >> local.properties
          echo "auth.api.base.url=${AUTH_API_BASE_URL}" >> local.properties

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew assembleNightly \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/app/keystore.jks" \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      - name: Rename APK
        run: mv app/build/outputs/apk/nightly/app-nightly.apk Airbeats-v${{ env.NEW_VERSION_NAME }}-Nightly.apk

      - name: Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.NEW_VERSION_NAME }}-nightly"
          name: "Airbeats-Nights v${{ env.NEW_VERSION_NAME }}"
          body: "This is the latest automatic nightly build generated from the main branch."
          prerelease: true
          files: Airbeats-v${{ env.NEW_VERSION_NAME }}-Nightly.apk





